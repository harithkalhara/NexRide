spring.application.name=NexRide
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8095}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.error.include-message=never
spring.jackson.serialization.write-dates-as-timestamps=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
nexride.data-dir=${NEXRIDE_DATA_DIR:./data}
nexride.admin-email=${NEXRIDE_ADMIN_EMAIL:admin@nexride.local}
nexride.admin-password=${NEXRIDE_ADMIN_PASSWORD:}
nexride.payhere.mode=${PAYHERE_MODE:disabled}
nexride.payhere.merchant-id=${PAYHERE_MERCHANT_ID:}
nexride.payhere.secret=${PAYHERE_MERCHANT_SECRET:}
nexride.public-url=${NEXRIDE_PUBLIC_URL:}

server.servlet.session.cookie.name=NEXRIDE_STUDIO_SESSION
spring.web.resources.cache.cachecontrol.no-store=true
